name: Public repository audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tracked files, links, example secrets and model checksums
        run: python tools/check-public-repo.py
      - name: Check publication tooling
        run: python -m unittest discover -s tools -p test_public_repo.py
      - name: Scan reachable history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          cd "$audit_dir"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location --retry 3 "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$audit_dir/gitleaks" git --redact=100 --log-opts=--all
