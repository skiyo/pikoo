<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pikoo · 桌面模拟器</title><link rel="stylesheet" href="/style.css"><main><header><span>PIKOO / 开发预览</span><span id="mode">本地模拟</span></header><h1>板子未到，先让 Pikoo 动起来。</h1><p class="intro">这里模拟设备的交互与通信。麦克风电路、回声消除和实机唤醒效果仍需到板测试。</p><section class="layout"><div class="device"><div class="screen" id="screen"><div class="eyes"><i></i><i></i></div><div id="status">休息中</div><small id="hint">点击唤醒开始</small></div><span class="brand">Pikoo</span></div><div class="controls"><div class="badge">设备控制</div><button id="wake">唤醒 Pikoo</button><button id="cancel" class="secondary">打断当前回答</button><div class="row"><button id="mute" class="secondary">关闭麦克风</button><button id="stop" class="secondary">结束对话</button></div><button id="drop" class="secondary">模拟断网</button><button id="takeover" class="secondary" hidden>接管当前家庭会话</button><label for="text">先用文字验证对话</label><form id="form"><input id="text" placeholder="给我讲一个简短的故事" autocomplete="off"><button>发送</button></form><label class="check"><input type="checkbox" id="mic">开启本机麦克风（需浏览器授权）</label><p id="notice">默认不采集麦克风。模拟模式只播放测试音。</p></div></section><section class="record"><div class="badge">运行记录</div><pre id="log" aria-live="polite"></pre></section></main><script type="module" src="/app.mjs"></script></html>
